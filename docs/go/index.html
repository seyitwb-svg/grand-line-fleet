<!doctype html>
<meta charset="utf-8">
<title>Grand Line Fleet — live apps</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="Grand Line Fleet — 21 self-hosted micro-SaaS tools">
<meta property="og:description" content="Resolving the current live app URL — $99 source bundle, BTC/USDT/x402 checkout.">
<meta property="og:image" content="https://seyitwb-svg.github.io/grand-line-fleet/og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  body{font-family:system-ui,sans-serif;max-width:40em;margin:4em auto;padding:0 1em;color:#222}
  a{color:#0a58ca}code{background:#f2f2f2;padding:.1em .3em;border-radius:3px}
</style>
<h1 id="h">Redirecting…</h1>
<p id="msg">Resolving the current live URL.</p>
<div id="links" hidden>
  <p>Pick a destination:</p><ul></ul>
</div>
<script>
const qs = new URLSearchParams(location.search);
const app = (qs.get("app") || "goldshop").replace(/[^a-z0-9-]/g, "");
const p = qs.get("p") || "";
const fallback = "https://github.com/seyitwb-svg/grand-line-fleet";
// static fallback: the storefront origin never depends on the JSON fetch
const STATIC = {goldshop: "https://grandline-fleet.shares.zrok.io"};
fetch("../live_urls.json", {cache: "no-store"})
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .catch(() => STATIC)
  .then(map => {
    try {
      const m = (map["metrik"] || "").replace(/\/+$/, "");
      if (m && navigator.sendBeacon) {
        navigator.sendBeacon(m + "/hit/io30mzhZrWkZ2Wbt",
          new Blob([JSON.stringify({p: "/go/" + app + p,
            r: document.referrer || ""})],
          {type: "application/json"}));
      }
    } catch (e) {}
    let base = map[app] || map["goldshop"];
    if (!base) throw "unknown";
    base = base.replace(/\/+$/, "");
    let dest = base;
    if (p && p.startsWith("/") && !p.startsWith("//")) dest += p;
    document.getElementById("h").textContent = "→ " + app;
    document.getElementById("msg").innerHTML = "Live at <a href=\"" + dest + "\">" + dest + "</a>";
    location.replace(dest);
  })
  .catch(() => {
    document.getElementById("h").textContent = "Link lookup failed";
    document.getElementById("msg").innerHTML =
      "The live address list could not be read. Visit <a href=\"" + fallback + "\">the repository</a> for current links.";
  });
</script>
